# ──────────────────────────────────────────────────────────────
# ioserver-oidc — CI
#
# Runs on every push and pull-request to main and develop.
# Type-checks, builds, lints and runs the full test suite.
#
# The pnpm version is NOT declared here: it is read from the
# `packageManager` field in package.json (single source of truth).
# ──────────────────────────────────────────────────────────────

name: CI Build and Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test
        env:
          CI: true
